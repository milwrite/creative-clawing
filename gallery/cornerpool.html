<!doctype html>
<html lang="en">
<head>
<style>.back-btn,#back,#info,#ui,.panel,.controls{display:none!important}</style>
<script>if(window.self===window.top)document.documentElement.classList.add('standalone')</script>
<style>html.standalone .back-btn,html.standalone #back,html.standalone #info,html.standalone #ui,html.standalone .panel,html.standalone .controls{display:revert!important}</style>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Corner Pool</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;height:100dvh;background:#080909;overflow:hidden}
body{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#d8d5c8}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.back-btn{position:fixed;top:16px;left:max(16px,env(safe-area-inset-left));z-index:2;color:#d8d5c8;text-decoration:none;background:rgba(8,9,9,.78);border:1px solid rgba(220,214,190,.25);padding:8px 10px}
#info{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));z-index:2;max-width:360px;padding:8px 10px;color:#d8d5c8;background:rgba(8,9,9,.72);border:1px solid rgba(220,214,190,.2)}
@media(max-width:600px){
  html.standalone body{display:flex;flex-direction:column}
  html.standalone canvas{position:relative;flex:1;min-height:0}
  html.standalone #info{position:relative;right:auto;bottom:auto;flex-shrink:0;max-width:none;padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
}
</style>
</head>
<body>
<a href="../" class="back-btn">&larr; Gallery</a>
<canvas id="c"></canvas>
<div id="info">Corner Pool. Drag to seed a new corner cluster. Degree-two vertices keep the drawing moving.</div>
<script>
// originAgent: moonshot
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
let W=0,H=0,DPR=1,t=0,last=0,scale=42;
let nodes=[],edges=[],faces=[],frontier=[],edgeSet=new Set(),nodeMap=new Map();
let pointer={x:.5,y:.5,down:false,lastSeed:0};
const dirs=[
  {x:1,y:0},{x:.5,y:.866},{x:-.5,y:.866},
  {x:-1,y:0},{x:-.5,y:-.866},{x:.5,y:-.866}
];
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function key(x,y){return Math.round(x*1000)+','+Math.round(y*1000)}
function edgeKey(a,b){return a<b?a+'-'+b:b+'-'+a}
function rand(i){return (Math.sin(i*127.1+nodes.length*19.7+t*.003)*43758.5453)%1}
function screen(p){return {x:W*.5+p.x*scale,y:H*.5+p.y*scale}}
function getNode(x,y){
  const k=key(x,y);
  if(nodeMap.has(k))return nodeMap.get(k);
  const n={x,y,edges:new Set(),born:t,heat:1};
  nodes.push(n);
  const id=nodes.length-1;
  nodeMap.set(k,id);
  return id;
}
function addEdge(a,b){
  if(a===b)return false;
  const k=edgeKey(a,b);
  if(edgeSet.has(k))return false;
  edgeSet.add(k);
  edges.push({a,b,born:t,live:1});
  nodes[a].edges.add(b);
  nodes[b].edges.add(a);
  nodes[a].heat=nodes[b].heat=1;
  return true;
}
function refreshFrontier(){
  frontier.length=0;
  const cx=nodes.reduce((s,n)=>s+n.x,0)/Math.max(1,nodes.length);
  const cy=nodes.reduce((s,n)=>s+n.y,0)/Math.max(1,nodes.length);
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i];
    if(n.edges.size!==2)continue;
    const d=Math.hypot(n.x-cx,n.y-cy);
    const p=screen(n);
    if(d<.12||p.x<-scale||p.y<-scale||p.x>W+scale||p.y>H+scale)continue;
    frontier.push(i);
  }
}
function chooseDirection(id){
  const n=nodes[id];
  const used=[...n.edges].map(j=>{
    const q=nodes[j];
    return Math.atan2(q.y-n.y,q.x-n.x);
  });
  const cx=nodes.reduce((s,p)=>s+p.x,0)/Math.max(1,nodes.length);
  const cy=nodes.reduce((s,p)=>s+p.y,0)/Math.max(1,nodes.length);
  const out=Math.atan2(n.y-cy,n.x-cx);
  let best=0,bestScore=-9;
  for(let i=0;i<dirs.length;i++){
    const a=Math.atan2(dirs[i].y,dirs[i].x);
    const apart=Math.min(...used.map(u=>Math.abs(Math.atan2(Math.sin(a-u),Math.cos(a-u)))));
    const outward=Math.cos(a-out);
    const score=apart*.65+outward*.85+rand(i)*.22;
    if(score>bestScore){bestScore=score;best=i}
  }
  return dirs[best];
}
function wouldCrowd(ids){
  for(const id of ids){
    const p=screen(nodes[id]);
    if(p.x<-80||p.y<-80||p.x>W+80||p.y>H+80)return true;
  }
  return false;
}
function growFrom(id){
  const n=nodes[id];
  if(!n||n.edges.size!==2)return false;
  const neighbors=[...n.edges];
  const a=nodes[neighbors[0]],b=nodes[neighbors[1]];
  const d=chooseDirection(id);
  const jitter=(rand(id)-.5)*.08;
  const dx=d.x+jitter*d.y,dy=d.y-jitter*d.x;
  const v2=getNode(n.x+dx,n.y+dy);
  const a2=getNode(a.x+dx,a.y+dy);
  const b2=getNode(b.x+dx,b.y+dy);
  if(wouldCrowd([v2,a2,b2]))return false;
  const added=[
    addEdge(neighbors[0],a2),
    addEdge(id,v2),
    addEdge(neighbors[1],b2),
    addEdge(a2,v2),
    addEdge(v2,b2)
  ].filter(Boolean).length;
  if(added){
    faces.push({a:neighbors[0],b:id,c:neighbors[1],d:v2,e:a2,f:b2,born:t,alpha:.04});
    refreshFrontier();
  }
  return added>0;
}
function seedCluster(px,py,r=1){
  const cx=(px-W*.5)/scale,cy=(py-H*.5)/scale;
  const a=getNode(cx-r*.5,cy-r*.32);
  const b=getNode(cx+r*.5,cy-r*.32);
  const c=getNode(cx+r*.5,cy+r*.32);
  const d=getNode(cx-r*.5,cy+r*.32);
  addEdge(a,b);addEdge(b,c);addEdge(c,d);addEdge(d,a);
  refreshFrontier();
}
function reset(){
  nodes=[];edges=[];faces=[];frontier=[];edgeSet=new Set();nodeMap=new Map();
  seedCluster(W*.5,H*.5,1.25);
  seedCluster(W*.5-scale*2.2,H*.5+scale*.7,.82);
  seedCluster(W*.5+scale*2.1,H*.5-scale*.6,.68);
  for(let i=0;i<(window.self!==window.top?90:40);i++)tickGrowth();
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  const rect=canvas.getBoundingClientRect();
  W=Math.max(1,Math.floor(rect.width||innerWidth));
  H=Math.max(1,Math.floor(rect.height||innerHeight));
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=clamp(Math.min(W,H)/12,28,54);
  reset();
}
function tickGrowth(){
  if(frontier.length<1)return;
  const tries=frontier.length>80?3:7;
  for(let k=0;k<tries;k++){
    const id=frontier[Math.floor(Math.abs(rand(k))*frontier.length)%frontier.length];
    if(growFrom(id))break;
  }
}
function colorFor(age,heat){
  const a=(age%90)/90;
  let c;
  if(a<.18)c=[36,35,31];
  else if(a<.45)c=[72,103,76];
  else if(a<.68)c=[178,145,79];
  else if(a<.84)c=[168,82,56];
  else c=[110,144,162];
  const h=clamp(heat,0,1);
  return `rgba(${c[0]+h*40|0},${c[1]+h*32|0},${c[2]+h*22|0},.88)`;
}
function draw(){
  ctx.fillStyle='rgba(8,9,9,.24)';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.lineCap='round';
  ctx.lineJoin='round';
  for(const f of faces){
    const pts=[nodes[f.a],nodes[f.e],nodes[f.d],nodes[f.f],nodes[f.c],nodes[f.b]].map(screen);
    const age=t-f.born;
    const alpha=clamp(.02+age*.0004,0,.1);
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.closePath();
    ctx.fillStyle=`rgba(214,195,150,${alpha})`;
    ctx.fill();
  }
  for(const e of edges){
    const a=screen(nodes[e.a]),b=screen(nodes[e.b]);
    const age=t-e.born;
    ctx.strokeStyle=colorFor(age,(nodes[e.a].heat+nodes[e.b].heat)*.5);
    ctx.lineWidth=clamp(2.6-age*.006,1.05,2.6);
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();
  }
  ctx.globalCompositeOperation='screen';
  ctx.strokeStyle='rgba(238,230,198,.08)';
  for(const id of frontier){
    const p=screen(nodes[id]);
    ctx.beginPath();
    ctx.arc(p.x,p.y,4+Math.sin(t*.04+id)*1.5,0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}
function frame(now){
  const dt=Math.min(.05,((now||0)-last)/1000||.016);
  last=now||0;
  t+=dt*60;
  const steps=window.self!==window.top?2:1;
  for(let i=0;i<steps;i++)tickGrowth();
  for(const n of nodes)n.heat*=.985;
  draw();
  requestAnimationFrame(frame);
}
function setPointer(e){
  const r=canvas.getBoundingClientRect();
  pointer.x=clamp((e.clientX-r.left)/Math.max(1,r.width),0,1);
  pointer.y=clamp((e.clientY-r.top)/Math.max(1,r.height),0,1);
}
canvas.addEventListener('pointerdown',e=>{setPointer(e);pointer.down=true;canvas.setPointerCapture(e.pointerId);seedCluster(pointer.x*W,pointer.y*H,.62);});
canvas.addEventListener('pointermove',e=>{setPointer(e);if(pointer.down&&t-pointer.lastSeed>14){seedCluster(pointer.x*W,pointer.y*H,.42);pointer.lastSeed=t;}});
canvas.addEventListener('pointerup',e=>{pointer.down=false;try{canvas.releasePointerCapture(e.pointerId)}catch(err){}});
canvas.addEventListener('pointercancel',()=>{pointer.down=false;});
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('resize',()=>requestAnimationFrame(resize));
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,200));
requestAnimationFrame(()=>{
  resize();
  setTimeout(resize,200);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
