<title>Ant Colony</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100svh;min-height:-webkit-fill-available;height:100%;height:100dvh;background:#04060a;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body{position:relative;-webkit-text-size-adjust:100%;-webkit-touch-callout:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}
#info{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:min(calc(100vw - max(32px,env(safe-area-inset-left) + env(safe-area-inset-right) + 32px)),42rem);color:rgba(255,255,255,0.8);background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:6px;font:12px/1.5 ui-monospace,monospace;pointer-events:none;text-align:center}
.back-btn{position:fixed;top:max(16px, env(safe-area-inset-top));right:max(16px, env(safe-area-inset-right));background:rgba(20,20,20,0.8);border:1px solid #444;color:#e0e0e0;padding:8px 14px;border-radius:6px;font:12px ui-monospace,monospace;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);z-index:1000;transition:border-color 0.2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.back-btn:hover{border-color:#888}

<body>
<a href="./" class="back-btn">← Gallery</a>
<canvas id="c"></canvas>
<div id="info">Ant Colony · click to place food · right-click to move nest</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
let W,H,dpr=1;
let lastTouchPlacementAt=0;

const CELL=4;
let GW,GH;
let phHome,phFood;

let nest={x:0,y:0};
const foods=[];
const ants=[];
const ANT_COUNT=180;
const FOOD_RADIUS=22;

const TAU=Math.PI*2;
const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,lo,hi)=>v<lo?lo:v>hi?hi:v;
function idx(gx,gy){return gy*GW+gx}
function gcell(wx,wy){return{gx:Math.floor(wx/CELL)|0, gy:Math.floor(wy/CELL)|0}}
function getCanvasPoint(evt){
  const rect=c.getBoundingClientRect();
  if(evt.changedTouches&&evt.changedTouches[0]){
    return {x:evt.changedTouches[0].clientX-rect.left,y:evt.changedTouches[0].clientY-rect.top};
  }
  return {x:evt.clientX-rect.left,y:evt.clientY-rect.top};
}

function newAnt(){
  return{x:nest.x,y:nest.y,angle:rand(0,TAU),speed:rand(1.2,2.0),hasFood:false,wiggle:rand(0,TAU),stepsSinceHome:0,stepsSinceFood:0};
}

function senseDir(ant,grid,offset){
  const sensorDist=14;
  const a=ant.angle+offset;
  const sx=ant.x+Math.cos(a)*sensorDist;
  const sy=ant.y+Math.sin(a)*sensorDist;
  const {gx,gy}=gcell(sx,sy);
  if(gx<0||gx>=GW||gy<0||gy>=GH)return 0;
  return grid[idx(gx,gy)];
}

function stepAnt(ant){
  const followGrid=ant.hasFood?phHome:phFood;
  const depositGrid=ant.hasFood?phFood:phHome;
  const sl=senseDir(ant,followGrid,-0.5);
  const sf=senseDir(ant,followGrid,0.0);
  const sr=senseDir(ant,followGrid,0.5);
  if(sf>sl&&sf>sr)ant.angle+=rand(-0.15,0.15);
  else if(sl>sr)ant.angle-=rand(0.2,0.5);
  else if(sr>sl)ant.angle+=rand(0.2,0.5);
  else ant.angle+=rand(-0.4,0.4);

  ant.x+=Math.cos(ant.angle)*ant.speed;
  ant.y+=Math.sin(ant.angle)*ant.speed;

  if(ant.x<2){ant.x=2;ant.angle=Math.PI-ant.angle+rand(-0.3,0.3)}
  if(ant.x>W-2){ant.x=W-2;ant.angle=Math.PI-ant.angle+rand(-0.3,0.3)}
  if(ant.y<2){ant.y=2;ant.angle=-ant.angle+rand(-0.3,0.3)}
  if(ant.y>H-2){ant.y=H-2;ant.angle=-ant.angle+rand(-0.3,0.3)}

  const {gx,gy}=gcell(ant.x,ant.y);
  if(gx>=0&&gx<GW&&gy>=0&&gy<GH){
    const maxSteps=350;
    const steps=ant.hasFood?ant.stepsSinceFood:ant.stepsSinceHome;
    const strength=clamp(1-(steps/maxSteps),0.04,1)*5.0;
    depositGrid[idx(gx,gy)]=clamp(depositGrid[idx(gx,gy)]+strength,0,255);
  }

  ant.stepsSinceHome++;
  ant.stepsSinceFood++;

  if(!ant.hasFood){
    for(let fi=foods.length-1;fi>=0;fi--){
      const f=foods[fi];
      const dx=ant.x-f.x,dy=ant.y-f.y;
      if(dx*dx+dy*dy<FOOD_RADIUS*FOOD_RADIUS&&f.amount>0){
        ant.hasFood=true;
        f.amount-=1;
        ant.angle+=Math.PI+rand(-0.3,0.3);
        ant.stepsSinceFood=0;
        if(f.amount<=0)foods.splice(fi,1);
        break;
      }
    }
  }else{
    const dx=ant.x-nest.x,dy=ant.y-nest.y;
    if(dx*dx+dy*dy<16*16){
      ant.hasFood=false;
      ant.angle+=Math.PI+rand(-0.3,0.3);
      ant.stepsSinceHome=0;
    }
  }
}

const evapRate=0.992;
function diffuse(grid){
  const tmp=new Float32Array(GW*GH);
  for(let y=1;y<GH-1;y++){
    for(let x=1;x<GW-1;x++){
      const v=grid[idx(x,y)]*0.6+grid[idx(x-1,y)]*0.1+grid[idx(x+1,y)]*0.1+grid[idx(x,y-1)]*0.1+grid[idx(x,y+1)]*0.1;
      tmp[idx(x,y)]=v*evapRate;
    }
  }
  grid.set(tmp);
}

let imgData;
function render(){
  for(let gy=0;gy<GH;gy++){
    for(let gx=0;gx<GW;gx++){
      const ph=phFood[idx(gx,gy)];
      const ph2=phHome[idx(gx,gy)];
      const px=(gx*CELL)|0;
      const py=(gy*CELL)|0;
      const rFood=Math.min(ph*1.5,200)|0;
      const gFood=Math.min(ph*0.8,130)|0;
      const rHome=Math.min(ph2*0.3,60)|0;
      const gHome=Math.min(ph2*1.2,200)|0;
      const bHome=Math.min(ph2*0.4,80)|0;
      for(let dy=0;dy<CELL&&py+dy<H;dy++){
        for(let dx=0;dx<CELL&&px+dx<W;dx++){
          const pi=((py+dy)*W+(px+dx))*4;
          imgData.data[pi]=Math.min(rFood+rHome,255);
          imgData.data[pi+1]=Math.min(gFood+gHome,255);
          imgData.data[pi+2]=bHome;
          imgData.data[pi+3]=255;
        }
      }
    }
  }
  ctx.putImageData(imgData,0,0);

  for(const f of foods){
    const frac=f.amount/f.maxAmount;
    ctx.beginPath();
    ctx.arc(f.x,f.y,FOOD_RADIUS*frac+4,0,TAU);
    ctx.fillStyle=`rgba(60,220,80,${0.25+frac*0.5})`;
    ctx.fill();
    ctx.strokeStyle=`rgba(100,255,120,${0.5+frac*0.3})`;
    ctx.lineWidth=1.5;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(nest.x,nest.y,12,0,TAU);
  ctx.fillStyle='rgba(255,180,40,0.25)';
  ctx.fill();
  ctx.strokeStyle='rgba(255,200,60,0.8)';
  ctx.lineWidth=2;
  ctx.stroke();

  for(const ant of ants){
    ctx.save();
    ctx.translate(ant.x,ant.y);
    ctx.rotate(ant.angle);
    ctx.fillStyle=ant.hasFood?'#50e870':'#e8c060';
    ctx.fillRect(-2,-1,4,2);
    ctx.restore();
  }
}

function spawnFood(ex,ey){foods.push({x:ex,y:ey,amount:600,maxAmount:600});}

function init(){
  const rect=c.getBoundingClientRect();
  const viewport=window.visualViewport;
  const width=Math.round(viewport?.width||window.innerWidth||document.documentElement.clientWidth||rect.width||0);
  const height=Math.round(viewport?.height||window.innerHeight||document.documentElement.clientHeight||rect.height||0);
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(width,1);
  H=Math.max(height,1);
  c.width=Math.max(1,Math.round(W*dpr));
  c.height=Math.max(1,Math.round(H*dpr));
  c.style.width=`${W}px`;
  c.style.height=`${H}px`;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  GW=Math.ceil(W/CELL);GH=Math.ceil(H/CELL);
  phHome=new Float32Array(GW*GH);
  phFood=new Float32Array(GW*GH);
  imgData=ctx.createImageData(W,H);
  for(let i=3;i<imgData.data.length;i+=4)imgData.data[i]=255;

  nest.x=W/2;nest.y=H/2;
  ants.length=0;
  foods.length=0;
  for(let i=0;i<ANT_COUNT;i++)ants.push(newAnt());
  const offsets=[[0.22,0.2],[0.78,0.25],[0.15,0.75],[0.82,0.7],[0.5,0.12]];
  for(const [fx,fy] of offsets)spawnFood(W*fx,H*fy);
}

let tick=0;
function loop(){
  requestAnimationFrame(loop);
  for(const ant of ants)stepAnt(ant);
  tick++;
  if(tick%3===0){diffuse(phFood);diffuse(phHome);}
  if(tick%420===0&&foods.length<3)spawnFood(rand(W*0.1,W*0.9),rand(H*0.1,H*0.9));
  render();
}

let resizeQueued=false;
function scheduleResize(){
  if(resizeQueued)return;
  resizeQueued=true;
  requestAnimationFrame(()=>{
    resizeQueued=false;
    init();
  });
}

addEventListener('resize',scheduleResize,{passive:true});
window.addEventListener('pageshow',scheduleResize,{passive:true});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)scheduleResize(); },{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',scheduleResize,{passive:true});
  window.visualViewport.addEventListener('scroll',scheduleResize,{passive:true});
}

let dprQuery;
function unwatchDpr(){
  if(!dprQuery)return;
  if(typeof dprQuery.removeEventListener==='function')dprQuery.removeEventListener('change',watchDpr);
  else if(typeof dprQuery.removeListener==='function')dprQuery.removeListener(watchDpr);
}
function watchDpr(){
  unwatchDpr();
  dprQuery=matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
  if(typeof dprQuery.addEventListener==='function')dprQuery.addEventListener('change',watchDpr,{once:true});
  else if(typeof dprQuery.addListener==='function')dprQuery.addListener(watchDpr);
  scheduleResize();
}
watchDpr();
requestAnimationFrame(()=>{init();setTimeout(init,200);loop();});

c.addEventListener('click',e=>{
  if(performance.now()-lastTouchPlacementAt<700)return;
  const {x,y}=getCanvasPoint(e);
  spawnFood(x,y);
});
c.addEventListener('touchend',e=>{
  e.preventDefault();
  lastTouchPlacementAt=performance.now();
  const {x,y}=getCanvasPoint(e);
  spawnFood(x,y);
},{passive:false});

c.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const {x,y}=getCanvasPoint(e);
  nest.x=x;nest.y=y;
  for(const ant of ants){ant.x=nest.x;ant.y=nest.y;ant.angle=rand(0,TAU);}
});
</script>
</body>
