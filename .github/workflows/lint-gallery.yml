name: Lint Gallery

on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "artifacts/**"
      - "microblog/**"
      - "data/**"
      - "scripts/preview-cards.js"
      - "styles/shared.css"
      - "index.html"
      - "gallery.html"
      - "microblogs.html"
      - "sw.js"
      - "update_manifest.py"
      - "tests/**"
      - ".github/workflows/lint-gallery.yml"
  pull_request:
    paths:
      - "gallery/**"
      - "artifacts/**"
      - "microblog/**"
      - "data/**"
      - "scripts/preview-cards.js"
      - "styles/shared.css"
      - "index.html"
      - "gallery.html"
      - "microblogs.html"
      - "sw.js"
      - "update_manifest.py"
      - "tests/**"
      - ".github/workflows/lint-gallery.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run gallery lint
        run: python3 tests/lint_gallery.py

      - name: Install test runner
        run: python3 -m pip install pytest

      - name: Run site tests
        run: python3 -m pytest -q
