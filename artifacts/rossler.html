<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>CAIL Sandbox maintenance</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #010203;
      --ink: #f4f4f7;
      --muted: #d0d2d8;
      --link: #c3d2ff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      color: var(--ink);
      font: 16px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Inter, Roboto, Arial, sans-serif;
    }

    .kale-mark,
    #motion {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .kale-mark {
      display: grid;
      place-items: center;
      overflow: hidden;
      opacity: .07;
      filter: brightness(.58) saturate(.68);
    }

    .kale-mark img {
      display: block;
      width: min(88vmin, 880px);
      height: min(88vmin, 880px);
      object-fit: contain;
    }

    #motion { z-index: 1; }

    .notice {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(690px, calc(100vw - 32px));
      max-height: calc(100dvh - 32px);
      overflow: auto;
      padding: clamp(24px, 4vw, 40px);
      transform: translate(-50%, -50%);
      color: var(--ink);
      background: rgba(34, 36, 42, .76);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 6px;
      box-shadow: 0 18px 70px rgba(0, 0, 0, .2);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
    }

    h1 {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 24px;
      font-size: clamp(1.45rem, 2.3vw, 1.9rem);
      font-weight: 650;
      letter-spacing: -.025em;
      line-height: 1.2;
    }

    .leaf-icon { font-size: .95em; }

    p {
      max-width: 68ch;
      margin: 0 0 18px;
      color: var(--muted);
    }

    p:last-child { margin-bottom: 0; }

    a {
      color: var(--link);
      text-underline-offset: 3px;
    }

    a:hover { color: #e0e7ff; }

    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 4px;
      border-radius: 2px;
    }

    @media (max-width: 600px) {
      .notice { padding: 24px 22px; }
      h1 { margin-bottom: 20px; }
      p { margin-bottom: 14px; }
      .kale-mark img { width: 96vmin; height: 96vmin; }
    }
  </style>
</head>
<body>
  <div class="kale-mark" aria-hidden="true">
    <img src="../assets/images/kale-emblem.png" alt="">
  </div>
  <canvas id="motion" aria-hidden="true"></canvas>

  <main class="notice" aria-labelledby="page-title">
    <h1 id="page-title"><span class="leaf-icon" aria-hidden="true">🥬</span>CAIL Sandbox maintenance</h1>
    <p>The Sandbox is temporarily offline for a scheduled update that began at 12:30 a.m. EDT on October 17.</p>
    <p>Please check back shortly. Access will return after the upgrade and verification are complete.</p>
    <p>For help, contact <a href="mailto:ailab@gc.cuny.edu">ailab@gc.cuny.edu</a>.</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('motion');
      const ctx = canvas.getContext('2d');
      const kale = new Image();
      kale.src = '../assets/images/kale-emblem.png';

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const bound = .82;
      const pointCount = 440;
      const cubeVertices = [];
      const cubeEdges = [];
      let width = 0;
      let height = 0;
      let dpr = 1;
      let rossler = [];
      let traceTiles = [];
      let previousTime = 0;
      let elapsed = 0;
      let leafIndex = 0;
      let phase = 'travel';
      let phaseTime = 0;
      let cornerSigns = [-1, -1, -1];
      let exitStart = { x: 0, y: 0 };
      let exitDirection = { x: 1, y: 0 };
      let leaf = { x: -bound, y: -bound, z: -bound };
      let velocity = { x: .105, y: .105, z: .105 };

      for (let x = -1; x <= 1; x += 2) {
        for (let y = -1; y <= 1; y += 2) {
          for (let z = -1; z <= 1; z += 2) cubeVertices.push({ x, y, z });
        }
      }
      for (let a = 0; a < cubeVertices.length; a++) {
        for (let b = a + 1; b < cubeVertices.length; b++) {
          const va = cubeVertices[a], vb = cubeVertices[b];
          const difference = Math.abs(va.x - vb.x) + Math.abs(va.y - vb.y) + Math.abs(va.z - vb.z);
          if (difference === 2) cubeEdges.push([a, b]);
        }
      }

      function buildRossler() {
        let x = .1, y = 0, z = 0;
        const points = [];
        const dt = .005;
        for (let i = 0; i < 5200; i++) {
          const dx = -y - z;
          const dy = x + .2 * y;
          const dz = .2 + z * (x - 5.7);
          x += dx * dt;
          y += dy * dt;
          z += dz * dt;
          if (i > 1600 && i % 8 === 0) points.push({ x, y });
        }
        return points;
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const columns = Math.max(3, Math.ceil(width / 235));
        const rows = Math.max(3, Math.ceil(height / 220));
        traceTiles = [];
        for (let row = 0; row < rows; row++) {
          for (let column = 0; column < columns; column++) {
            traceTiles.push({
              x: (column + .5) * width / columns,
              y: (row + .5) * height / rows,
              cell: Math.min(width / columns, height / rows),
              angle: ((row * columns + column) % 7) * .34,
              phase: (row * columns + column) * 83
            });
          }
        }
      }

      function project(point, time) {
        const yaw = time * .035;
        const pitch = .46 + Math.sin(time * .022) * .11;
        const roll = Math.sin(time * .017) * .06;
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const cr = Math.cos(roll), sr = Math.sin(roll);
        const x1 = point.x * cy - point.z * sy;
        const z1 = point.x * sy + point.z * cy;
        const y2 = point.y * cp - z1 * sp;
        const z2 = point.y * sp + z1 * cp;
        const x3 = x1 * cr - y2 * sr;
        const y3 = x1 * sr + y2 * cr;
        const scale = Math.min(width, height) * .51;
        const perspective = 4 / (4 + z2 * .24);
        return {
          x: width / 2 + x3 * scale * perspective,
          y: height / 2 + y3 * scale * perspective,
          depth: z2
        };
      }

      function drawTraceTiles(time) {
        if (!rossler.length) return;
        const phaseRate = time * 20;
        for (let i = 0; i < traceTiles.length; i++) {
          const tile = traceTiles[i];
          const scale = tile.cell * .31 / 18;
          const c = Math.cos(tile.angle), s = Math.sin(tile.angle);
          const start = Math.floor((i * 17) % rossler.length);
          ctx.beginPath();
          for (let j = 0; j < pointCount; j++) {
            const p = rossler[(start + j) % rossler.length];
            const px = p.x * c - p.y * s;
            const py = p.x * s + p.y * c;
            const sx = tile.x + px * scale;
            const sy = tile.y + py * scale;
            if (j === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
          }
          ctx.strokeStyle = 'rgba(152, 184, 143, .065)';
          ctx.lineWidth = .75;
          ctx.stroke();

          const index = Math.floor((phaseRate + tile.phase) % rossler.length);
          const dot = rossler[index];
          const dx = dot.x * c - dot.y * s;
          const dy = dot.x * s + dot.y * c;
          ctx.beginPath();
          ctx.arc(tile.x + dx * scale, tile.y + dy * scale, 1.35, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(207, 231, 192, .3)';
          ctx.fill();
        }
      }

      function drawCube(time) {
        const projected = cubeVertices.map(vertex => project({
          x: vertex.x * bound,
          y: vertex.y * bound,
          z: vertex.z * bound
        }, time));
        for (const [a, b] of cubeEdges) {
          ctx.beginPath();
          ctx.moveTo(projected[a].x, projected[a].y);
          ctx.lineTo(projected[b].x, projected[b].y);
          const depth = (projected[a].depth + projected[b].depth) / 2;
          ctx.strokeStyle = depth > 0
            ? 'rgba(205, 223, 197, .16)'
            : 'rgba(149, 168, 147, .08)';
          ctx.lineWidth = depth > 0 ? 1.15 : .8;
          ctx.stroke();
        }
      }

      function beginExit(time) {
        phase = 'exit';
        phaseTime = 0;
        cornerSigns = [Math.sign(leaf.x), Math.sign(leaf.y), Math.sign(leaf.z)];
        const corner = project(leaf, time);
        exitStart = { x: corner.x, y: corner.y };
        let dx = corner.x - width / 2;
        let dy = corner.y - height / 2;
        const length = Math.hypot(dx, dy) || 1;
        exitDirection = { x: dx / length, y: dy / length };
      }

      function updateLeaf(dt, time) {
        phaseTime += dt;
        if (phase === 'travel') {
          const hit = { x: false, y: false, z: false };
          for (const axis of ['x', 'y', 'z']) {
            leaf[axis] += velocity[axis] * dt;
            if (leaf[axis] >= bound) {
              leaf[axis] = bound;
              velocity[axis] = -Math.abs(velocity[axis]);
              hit[axis] = true;
            } else if (leaf[axis] <= -bound) {
              leaf[axis] = -bound;
              velocity[axis] = Math.abs(velocity[axis]);
              hit[axis] = true;
            }
          }
          if (hit.x && hit.y && hit.z) beginExit(time);
        } else if (phase === 'enter') {
          const progress = Math.min(phaseTime / 1.25, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const start = {
            x: cornerSigns[0] * bound * 1.7,
            y: cornerSigns[1] * bound * 1.7,
            z: cornerSigns[2] * bound * 1.7
          };
          leaf = {
            x: start.x + (cornerSigns[0] * bound - start.x) * eased,
            y: start.y + (cornerSigns[1] * bound - start.y) * eased,
            z: start.z + (cornerSigns[2] * bound - start.z) * eased
          };
          if (progress >= 1) {
            phase = 'travel';
            phaseTime = 0;
            velocity = {
              x: -cornerSigns[0] * .105,
              y: -cornerSigns[1] * .105,
              z: -cornerSigns[2] * .105
            };
          }
        }
      }

      function drawLeaf(time) {
        if (!kale.complete || !kale.naturalWidth) return;
        let point;
        let alpha = 1;
        let rotation = time * .12 + leafIndex * .27;
        if (phase === 'exit') {
          const progress = Math.min(phaseTime / 1.1, 1);
          const eased = progress * progress * (3 - 2 * progress);
          point = {
            x: exitStart.x + exitDirection.x * Math.max(width, height) * 1.35 * eased,
            y: exitStart.y + exitDirection.y * Math.max(width, height) * 1.35 * eased
          };
          alpha = 1 - eased;
        } else if (phase === 'enter') {
          const progress = Math.min(phaseTime / 1.25, 1);
          point = project(leaf, time);
          alpha = progress;
        } else {
          point = project(leaf, time);
        }

        const size = Math.max(44, Math.min(86, Math.min(width, height) * .085));
        const sourceWidth = kale.naturalWidth / 2;
        const sourceHeight = kale.naturalHeight / 2;
        const sx = (leafIndex % 2) * sourceWidth;
        const sy = Math.floor(leafIndex / 2) * sourceHeight;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(point.x, point.y);
        ctx.rotate(rotation);
        ctx.shadowColor = 'rgba(174, 214, 146, .14)';
        ctx.shadowBlur = 12;
        ctx.drawImage(kale, sx, sy, sourceWidth, sourceHeight, -size / 2, -size / 2, size, size);
        ctx.restore();

        if (phase === 'exit' && phaseTime >= 1.1) {
          leafIndex = (leafIndex + 1) % 4;
          leaf = {
            x: cornerSigns[0] * bound * 1.7,
            y: cornerSigns[1] * bound * 1.7,
            z: cornerSigns[2] * bound * 1.7
          };
          phase = 'enter';
          phaseTime = 0;
        }
      }

      function drawFrame(time) {
        ctx.clearRect(0, 0, width, height);
        drawTraceTiles(time);
        drawCube(time);
        drawLeaf(time);
      }

      function frame(now) {
        if (!previousTime) previousTime = now;
        const dt = Math.min((now - previousTime) / 1000, .05);
        previousTime = now;
        elapsed += dt;
        updateLeaf(dt, elapsed);
        drawFrame(elapsed);
        requestAnimationFrame(frame);
      }

      rossler = buildRossler();
      resize();
      window.addEventListener('resize', resize, { passive: true });
      kale.addEventListener('load', () => {
        if (reducedMotion) drawFrame(0);
      });
      if (reducedMotion) drawFrame(0);
      else requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
