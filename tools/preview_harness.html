<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creative Clawing Preview Harness</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<script>
requestAnimationFrame(() => {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if (!id) return;
  const iframe = document.createElement('iframe');
  iframe.src = `/gallery/${encodeURIComponent(id)}.html?cc-preview-capture=1`;
  iframe.title = id;
  document.body.appendChild(iframe);
});
</script>
</body>
</html>
